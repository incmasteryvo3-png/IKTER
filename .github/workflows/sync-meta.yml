name: Sincronizar datos de Meta (manual)

# Antes esto corria solo cada 30 minutos (cron). Se quito porque nadie
# usa ese historial en el dashboard hoy (todo se consulta en vivo desde
# /api/insights) y solo generaba correos de "fallo" de GitHub sin
# aportar nada. El boton "Actualizar ahora" del dashboard sigue
# sincronizando al toque sin depender de este workflow para nada.
# Si en algun momento se quiere volver a automatizar, se agrega de nuevo
# el bloque "schedule:" de abajo (comentado como referencia).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/30 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/sync-meta
        run: |
          curl -sf -X GET "${{ secrets.SITE_URL }}/api/sync-meta" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
